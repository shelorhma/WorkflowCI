name: Telco CI

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        pip install mlflow pandas scikit-learn joblib

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run . --env-manager local

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: telco-model
        path: MLProject/model.pkl

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t telco-churn-model ./MLProject

    - name: Tag Docker Image
      run: |
        docker tag telco-churn-model ${{ secrets.DOCKER_USERNAME }}/telco-churn:latest

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn:latest